<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#07090f" />
  <title>ECHOBOUND — your past becomes your weapon</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui"></div>
  <script>
    window.__errs = [];
    const __show = (m) => { const d = document.getElementById('booterr'); if (d) { d.textContent += m + '\n'; } };
    window.addEventListener('error', (e) => { const m = (e.message || 'error') + ' @ ' + (e.filename || '').split('/').pop() + ':' + e.lineno; window.__errs.push(m); __show(m); });
    window.addEventListener('unhandledrejection', (e) => { const m = 'PROMISE: ' + ((e.reason && e.reason.stack) || e.reason); window.__errs.push(m); __show(m); });
  </script>
  <div id="booterr" style="position:fixed;top:2px;left:6px;z-index:999;color:#ff7a7a;font:12px monospace;white-space:pre-wrap;max-width:96vw;pointer-events:none"></div>
  <div id="rotate-lock"><div class="rl-inner"><div class="rl-icon">⟳</div>ROTATE YOUR DEVICE<span>ECHOBOUND plays in landscape</span></div></div>
  <noscript>ECHOBOUND requires JavaScript.</noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
